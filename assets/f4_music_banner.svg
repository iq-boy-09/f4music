<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">F4 Music Telegram Bot</title>
  <desc id="desc">Animated neon music banner credited to f4did</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/><stop offset=".55" stop-color="#15283d"/><stop offset="1" stop-color="#29131f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" x2="1"><stop stop-color="#58d7ff"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#ff6d2d"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="22" y="22" width="1156" height="316" rx="22" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".8"/>
  <g transform="translate(74 245)" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <path d="M0 0v-28M34 0v-54M68 0v-82M102 0v-40M136 0v-105M170 0v-66M204 0v-125M238 0v-76M272 0v-45M306 0v-98M340 0v-62M374 0v-112M408 0v-70M442 0v-38M476 0v-90M510 0v-120"/>
    <animateTransform attributeName="transform" type="translate" values="74 245;64 245;74 245" dur="3s" repeatCount="indefinite"/>
  </g>
  <text x="74" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="8">F4 MUSIC</text>
  <text x="80" y="150" fill="#9bdfff" font-family="Arial,sans-serif" font-size="22" letter-spacing="6">TELEGRAM MUSIC EXPERIENCE</text>
  <text x="80" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="25">SEARCH  •  PLAY  •  DOWNLOAD  •  REPEAT</text>
  <text x="1120" y="90" fill="#ff7a3d" font-family="Arial,sans-serif" font-size="54" text-anchor="middle">♪</text>
  <text x="600" y="320" fill="#fff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" letter-spacing="3">CRAFTED BY @f4did</text>
  <circle cx="1100" cy="275" r="18" fill="none" stroke="#ff7a3d" stroke-width="3" opacity=".7">
    <animate attributeName="r" values="18;29;18" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0;.7" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
